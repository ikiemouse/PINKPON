<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PINKPON CAM 💖</title>
  <link rel="icon" href="flower.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #ff4f8b;
      --pink-light: #ffb5d1;
      --bg1: #ffe6f2;
      --bg2: #fff0f8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--pink);
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Baloo 2', cursive;
      color: var(--pink);
      text-shadow: 0 2px 8px #ffc8e3;
      margin-bottom: 10px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }

    .container {
      position: relative;
      display: inline-block;
    }

    /* video wrapper: maintain a stable visible area and center the video inside */
    .video-wrapper {
      width: 90vw;
      max-width: 420px;
      aspect-ratio: 4/3;
      border: 4px solid var(--pink);
      border-radius: 18px;
      margin: 10px;
      box-shadow: 0 6px 32px #ff4f8b55;
      background: #fff;
      overflow: hidden;
      position: relative;
    }

    /* the actual <video> fills the wrapper and is centered by default */
    #camera {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center; /* <- Default: centered on load */
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }

    #photo {
      display: none;
      transform: scaleX(-1);
    }

    #controls {
      margin-top: 10px;
    }

    button {
      padding: 12px 20px;
      margin: 6px;
      font-size: clamp(0.9rem, 3vw, 1rem);
      cursor: pointer;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #ff4f8b, #ff95c5);
      color: #fff;
      font-weight: bold;
      box-shadow: 0 3px 10px #ff4f8b22;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      font-weight: bold;
      color: var(--pink);
      text-shadow: 0 4px 12px rgba(0,0,0,0.4);
      display: none;
      pointer-events: none;
    }

    .filter-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      gap: 6px;
    }

    .nav-btn {
      background: var(--pink);
      border: none;
      color: white;
      padding: 10px 14px;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 3px 10px #ff4f8b55;
    }

    .nav-btn:hover {
      transform: scale(1.1);
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      gap: 10px;
      padding: 8px;
      width: 70vw;
      max-width: 340px;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .filter-item {
      white-space: nowrap;
      padding: 8px 14px;
      background: white;
      border-radius: 10px;
      border: 2px solid var(--pink-light);
      color: var(--pink);
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.25s;
    }

    .filter-item.active {
      background: linear-gradient(90deg, #ff4f8b, #ff95c5);
      color: white;
      border-color: #ff4f8b;
      box-shadow: 0 2px 8px #ff8db877;
    }

    #preview {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .thumb {
      width: 80px;
      height: auto;
      object-fit: cover;
      border: 3px solid #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .toggle {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 10px auto;
      font-size: 1rem;
    }

    input[type="checkbox"] {
      accent-color: #ff4f8b;
      transform: scale(1.3);
      cursor: pointer;
    }

    .heart {
      position: fixed;
      top: -10px;
      color: #ff7aa8;
      font-size: 18px;
      animation: fall 6s linear forwards;
      z-index: -1;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    @media (min-width: 900px) {
      .video-wrapper {
        max-width: 640px;
        aspect-ratio: 16/9;
      }
    }
  </style>
</head>
<body>
  <h1>PINKPON CAM 💕</h1>

  <div class="toggle">
    <label for="timerToggle">⏱️ Timer:</label>
    <input type="checkbox" id="timerToggle" checked>
  </div>

  <div class="container">
    <div class="video-wrapper">
      <video id="camera" autoplay playsinline></video>
      <div id="countdown">3</div>
    </div>
    <canvas id="photo" style="display:none;"></canvas>
  </div>

  <div class="filter-wrapper">
    <button id="prevFilter" class="nav-btn">◀</button>

    <div id="filterCarousel" class="carousel">
      <div class="filter-item active" data-filter="none">✨ Normal</div>
      <div class="filter-item" data-filter="grayscale(100%)">🖤 B&W</div>
      <div class="filter-item" data-filter="sepia(60%)">🌻 Vintage</div>
      <div class="filter-item" data-filter="hue-rotate(190deg) saturate(130%)">💙 Blue</div>
      <div class="filter-item" data-filter="contrast(110%) brightness(105%) saturate(120%)">🌞 Bright</div>
      <div class="filter-item" data-filter="hue-rotate(-20deg) saturate(120%) brightness(105%)">🌸 Soft Pink</div>
      <div class="filter-item" data-filter="hue-rotate(50deg) brightness(95%) saturate(90%)">🌿 Calm</div>
      <div class="filter-item" data-filter="contrast(130%) brightness(95%) saturate(140%)">🍓 Retro</div>
      <div class="filter-item" data-filter="brightness(120%) blur(1px)">🌈 Dreamy</div>
    </div>

    <button id="nextFilter" class="nav-btn">▶</button>
  </div>

  <div id="controls">
    <button id="capture">Click</button>
    <button id="toFrame" disabled>Go to Frame</button>
  </div>

  <div id="preview"></div>

  <audio id="shutterSound" src="https://www.soundjay.com/mechanical/camera-shutter-click-01.mp3" preload="auto"></audio>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      /* CAMERA PREFERENCES */
      const constraints = {
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 960 }
        },
        audio: false
      };

      /* Falling Hearts */
      function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '💖';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = 3 + Math.random() * 3 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
      }
      setInterval(createHeart, 200);

      /* ELEMENTS */
      const video = document.getElementById('camera');
      const canvas = document.getElementById('photo');
      const captureBtn = document.getElementById('capture');
      const toFrameBtn = document.getElementById('toFrame');
      const preview = document.getElementById('preview');
      const countdown = document.getElementById('countdown');
      const shutterSound = document.getElementById('shutterSound');
      const timerToggle = document.getElementById('timerToggle');

      let photos = [];
      let currentFilter = 'none';
      let useTimer = true;

      // start camera and handle permission errors gracefully
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          // update canvas size when metadata is available
          video.addEventListener('loadedmetadata', () => {
            updateCanvasSize();
          });
          window.addEventListener('resize', () => updateCanvasSize());
          window.addEventListener('orientationchange', () => setTimeout(updateCanvasSize, 200));
        } catch (err) {
          console.error('getUserMedia error', err);
          alert('Tidak bisa akses kamera: ' + (err && err.message ? err.message : err));
        }
      }

      // try to start camera immediately
      startCamera();

      // helper: parse object-position string -> fractions 0..1
      function parseObjectPosition(posStr) {
        if (!posStr) posStr = '50% 50%';
        const parts = posStr.trim().split(/\s+/);
        let x = parts[0] || '50%';
        let y = parts[1] || (parts[0] ? '50%' : '50%');

        const kw = { left: '0%', center: '50%', right: '100%', top: '0%', bottom: '100%' };

        if (kw[x]) x = kw[x];
        if (kw[y]) y = kw[y];

        const toFraction = v => {
          if (typeof v === 'string' && v.endsWith('%')) {
            return Math.max(0, Math.min(1, parseFloat(v) / 100));
          }
          const n = parseFloat(v);
          if (isFinite(n)) return Math.max(0, Math.min(1, n));
          return 0.5;
        };

        return { xFrac: toFraction(x), yFrac: toFraction(y) };
      }

      // New: set canvas size based on displayed element size * DPR
      function updateCanvasSize() {
        const rect = video.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        // video metadata might not be ready yet
        if (!video.videoWidth || !video.videoHeight) return;
        // canvas size in physical pixels
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        // keep CSS size in sync (helps debugging)
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
      }

      timerToggle.addEventListener('change', () => {
        useTimer = timerToggle.checked;
      });

      // compute visible source rect when video uses object-fit: cover and object-position
      function computeVisibleSourceRect() {
        const rect = video.getBoundingClientRect();
        const elemRatio = rect.width / rect.height;
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) return { sx: 0, sy: 0, sw: vw, sh: vh };

        const videoRatio = vw / vh;
        let sx = 0, sy = 0, sw = vw, sh = vh;

        // read CSS object-position of video (computed)
        const style = window.getComputedStyle(video);
        const objPos = style.objectPosition || '50% 50%';
        const pos = parseObjectPosition(objPos); // { xFrac, yFrac }

        if (videoRatio > elemRatio) {
          // video is wider -> crop left/right
          sw = Math.round(vh * elemRatio);
          sx = Math.round((vw - sw) * pos.xFrac); // offset based on object-position x
          sy = 0;
          sh = vh;
        } else {
          // video is taller -> crop top/bottom
          sh = Math.round(vw / elemRatio);
          sy = Math.round((vh - sh) * pos.yFrac); // offset based on object-position y
          sx = 0;
          sw = vw;
        }

        // clamp
        sx = Math.max(0, Math.min(vw - sw, sx));
        sy = Math.max(0, Math.min(vh - sh, sy));

        return { sx, sy, sw, sh };
      }

      function takePhoto() {
        // ensure metadata is ready
        if (!video.videoWidth || !video.videoHeight) {
          video.addEventListener('loadedmetadata', takePhoto, { once: true });
          return;
        }

        // set canvas pixel size to match displayed area * DPR
        updateCanvasSize();

        const ctx = canvas.getContext('2d');
        // clear and apply filter
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.filter = currentFilter || 'none';

        const src = computeVisibleSourceRect();

        // mirror horizontally so result matches preview (preview is CSS-flipped)
        ctx.save();
        ctx.setTransform(-1, 0, 0, 1, canvas.width, 0);

        // draw the cropped region from the video (video pixels) into the canvas (canvas pixels)
        ctx.drawImage(
          video,
          src.sx, src.sy, src.sw, src.sh,    // source rect in video pixels
          0, 0, canvas.width, canvas.height  // destination rect in canvas pixels
        );

        ctx.restore();

        const dataURL = canvas.toDataURL("image/png");
        photos.push(dataURL);
        shutterSound.currentTime = 0;
        shutterSound.play();

        const img = document.createElement("img");
        img.src = dataURL;
        img.className = "thumb";
        preview.appendChild(img);

        if (photos.length === 4) {
          toFrameBtn.disabled = false;
          captureBtn.disabled = true;
        }
      }

      captureBtn.onclick = () => {
        if (photos.length >= 4) return;
        if (useTimer) {
          let counter = 3;
          countdown.textContent = counter;
          countdown.style.display = "block";
          const interval = setInterval(() => {
            counter--;
            if (counter > 0) {
              countdown.textContent = counter;
            } else {
              clearInterval(interval);
              countdown.style.display = "none";
              takePhoto();
            }
          }, 1000);
        } else {
          takePhoto();
        }
      };

      toFrameBtn.onclick = () => {
        localStorage.setItem("capturedPhotos", JSON.stringify(photos));
        window.location.href = "Frame.html";
      };

      /* FILTER CAROUSEL LOGIC */
      const carousel = document.getElementById("filterCarousel");
      const filterItems = document.querySelectorAll(".filter-item");
      const prevBtn = document.getElementById("prevFilter");
      const nextBtn = document.getElementById("nextFilter");
      let currentIndex = 0;

      function applyFilter(index) {
        filterItems.forEach(item => item.classList.remove("active"));
        filterItems[index].classList.add("active");
        currentFilter = filterItems[index].getAttribute("data-filter");
        video.style.filter = currentFilter;
      }

      filterItems.forEach((item, index) => {
        item.addEventListener("click", () => {
          currentIndex = index;
          applyFilter(index);
          carousel.scrollTo({ left: item.offsetLeft - 40, behavior: "smooth" });
        });
      });

      prevBtn.onclick = () => {
        if (currentIndex > 0) currentIndex--;
        applyFilter(currentIndex);
        carousel.scrollTo({ left: filterItems[currentIndex].offsetLeft - 40, behavior: "smooth" });
      };

      nextBtn.onclick = () => {
        if (currentIndex < filterItems.length - 1) currentIndex++;
        applyFilter(currentIndex);
        carousel.scrollTo({ left: filterItems[currentIndex].offsetLeft - 40, behavior: "smooth" });
      };

      let startX = 0;
      carousel.addEventListener("touchstart", e => startX = e.touches[0].clientX);
      carousel.addEventListener("touchend", e => {
        let endX = e.changedTouches[0].clientX;
        let diff = startX - endX;
        if (Math.abs(diff) > 50) {
          if (diff > 0 && currentIndex < filterItems.length - 1) currentIndex++;
          else if (diff < 0 && currentIndex > 0) currentIndex--;
          applyFilter(currentIndex);
          carousel.scrollTo({ left: filterItems[currentIndex].offsetLeft - 40, behavior: "smooth" });
        }
      });

      /* AI HAND GESTURE (MediaPipe Hands) */
      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

      let gestureCooldown = false;
      hands.onResults((results) => {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;
        const landmarks = results.multiHandLandmarks[0];
        const wrist = landmarks[0];
        const middleTip = landmarks[12];
        const palmY = wrist.y - middleTip.y;
        if (palmY > 0.3 && !gestureCooldown) {
          gestureCooldown = true;
          let counter = 3;
          countdown.textContent = counter;
          countdown.style.display = "block";
          const timer = setInterval(() => {
            counter--;
            if (counter > 0) countdown.textContent = counter;
            else {
              clearInterval(timer);
              countdown.style.display = "none";
              takePhoto();
              setTimeout(() => gestureCooldown = false, 3000);
            }
          }, 1000);
        }
      });

      const cameraAI = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 640,
        height: 480
      });
      cameraAI.start();
    });
  </script>
</body>
</html>
