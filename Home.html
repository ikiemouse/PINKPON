<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PINKPON CAM 💖</title>
  <link rel="icon" href="flower.png" type="image/png">

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --pink:#ff4f8b;
      --pink-2:#ff95c5;
      --bg1:#fff0f6;
      --bg2:#fff7fb;
      --card:#fff;
      --muted:#9b6a7a;
      --glass: rgba(255,255,255,0.85);
      --soft-shadow: 0 10px 30px rgba(255,79,139,0.12);
      --round: 14px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:'Poppins',sans-serif;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--pink);
      display:flex;
      justify-content:center;
      padding:28px 18px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .app {
      width:100%;
      max-width:920px;
      text-align:center;
    }

    h1{
      font-family:'Baloo 2',cursive;
      margin:0;
      font-size:clamp(1.6rem,4vw,2.6rem);
      color:var(--pink);
      letter-spacing:0.6px;
      margin-bottom:12px;
    }

    .instructions {
      display:flex;
      gap:12px;
      justify-content:center;
      margin-bottom:14px;
      align-items:center;
      flex-wrap:wrap;
    }
    .badge {
      background: linear-gradient(90deg,var(--pink),var(--pink-2));
      color:white;
      padding:8px 14px;
      border-radius:999px;
      font-weight:700;
      box-shadow:0 6px 22px rgba(255,79,139,0.12);
      transform-origin:center;
      transition: transform .28s cubic-bezier(.2,.9,.3,1), opacity .18s;
    }
    .badge.hand {
      background: linear-gradient(90deg,#fff0f4,#fff4f7);
      color:#7b2744;
      border:1px solid rgba(255,79,139,0.06);
      box-shadow: 0 6px 18px rgba(255,79,139,0.06);
    }

    .container {
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    .video-wrapper {
      width:90vw;
      max-width:720px;
      aspect-ratio: 16/9;
      background: var(--card);
      border-radius: var(--round);
      padding:8px;
      border: 3px solid rgba(255,80,140,0.12);
      box-shadow: var(--soft-shadow);
      position:relative;
      overflow:hidden;
      transition: transform .22s cubic-bezier(.2,.9,.3,1), box-shadow .22s;
    }
    .video-wrapper:hover{ transform: translateY(-6px); box-shadow: 0 20px 46px rgba(255,79,139,0.14); }

    #camera {
      width:100%;
      height:100%;
      object-fit:cover;
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
      display:block;
      border-radius: calc(var(--round) - 6px);
      transition: filter .24s ease, transform .18s ease;
      background: #faf7fb;
    }

    #countdown {
      position:absolute;
      top:50%;
      left:50%;
      transform: translate(-50%,-50%) scale(0.92);
      font-size:4.6rem;
      font-weight:900;
      color:var(--pink);
      text-shadow: 0 8px 28px rgba(255,164,189,0.22);
      display:flex;
      align-items:center;
      justify-content:center;
      width:160px;
      height:160px;
      border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(255,255,255,0.12));
      opacity:0;
      transform-origin:center;
      transition: opacity .18s, transform .22s cubic-bezier(.2,.9,.3,1);
      pointer-events:none;
      backdrop-filter: blur(2px);
      border: 2px solid rgba(255,255,255,0.28);
    }
    #countdown.show{
      opacity:1;
      transform: translate(-50%,-50%) scale(1);
    }

    .hand-hint {
      position:absolute;
      top:12px;
      left:12px;
      background: rgba(255,255,255,0.9);
      padding:6px 10px;
      border-radius:999px;
      font-weight:700;
      color:#7b2744;
      display:flex;
      gap:8px;
      align-items:center;
      transform-origin:left center;
      transition: transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s, opacity .18s;
      opacity:0.96;
      border:1px solid rgba(255,79,139,0.06);
    }
    .hand-hint.detected { transform: translateX(6px) scale(1.04); box-shadow: 0 10px 30px rgba(24,194,139,0.08); }

    .carousel {
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding:8px;
      border-radius:999px;
      background: rgba(255,255,255,0.9);
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      width:70vw;
      max-width:420px;
    }
    .filter-item{ padding:8px 12px; border-radius:12px; background:white; border:2px solid rgba(255,181,209,0.5); color:var(--pink); font-weight:700; cursor:pointer; white-space:nowrap; }
    .filter-item.active{ transform: translateY(-4px); box-shadow: 0 12px 34px rgba(255,79,139,0.08); background: linear-gradient(90deg,var(--pink),var(--pink-2)); color:#fff; }

    #controls { display:flex; gap:12px; margin-top:12px; justify-content:center; align-items:center; flex-wrap:wrap; }
    button { border: none; padding:10px 18px; border-radius:12px; background: linear-gradient(90deg,var(--pink),var(--pink-2)); color:#fff; font-weight:800; cursor:pointer; box-shadow: 0 8px 28px rgba(255,79,139,0.08); }
    button:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }

    #preview{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
    .thumb { width:86px; height:86px; object-fit:cover; border-radius:10px; border:3px solid #fff; box-shadow: 0 10px 28px rgba(0,0,0,0.10); transform: translateY(8px) scale(.96); opacity:0; transition: transform .28s, opacity .22s; cursor:pointer; }
    .thumb.show{ transform: translateY(0) scale(1); opacity:1; }

    @media(min-width:980px){ .video-wrapper{ max-width:880px; aspect-ratio: 16/9; } .carousel{ max-width:560px; width:59%; }
    }
    @media(max-width:420px){ .carousel{ width:92vw; max-width:92vw; } #countdown{ width:120px; height:120px; font-size:3.2rem; } .thumb{ width:68px; height:68px; } }

    .sr-only{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  </style>
</head>
<body>
  <div class="app">
    <h1>PINKPON CAM 💕</h1>

    <div class="instructions" aria-live="polite">
      <div class="badge" id="badgeMin">Minimal 4 photo</div>
      <div class="badge hand" id="badgeHand">Tunjukan telapak tangan ke kamera</div>
    </div>

    <div class="container">
      <div class="video-wrapper" id="videoBox">
        <video id="camera" autoplay playsinline muted></video>

        <div id="countdown" aria-hidden="true">3</div>

        <div class="hand-hint" id="handHint" aria-hidden="true" style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;">
          <span style="font-size:14px">✋</span>
          <span style="font-weight:700;color:#7b2744">Terdeteksi</span>
        </div>
      </div>

      <div class="filter-wrapper" aria-hidden="false">
        <button id="prevFilter" class="nav-btn" aria-label="Previous filter">◀</button>

        <div id="filterCarousel" class="carousel" role="list">
          <div class="filter-item active" data-filter="none" role="listitem" tabindex="0">✨ Normal</div>
          <div class="filter-item" data-filter="grayscale(100%)" role="listitem" tabindex="0">🖤 B&W</div>
          <div class="filter-item" data-filter="sepia(60%)" role="listitem" tabindex="0">🌻 Vintage</div>
          <div class="filter-item" data-filter="hue-rotate(190deg) saturate(130%)" role="listitem" tabindex="0">💙 Blue</div>
          <div class="filter-item" data-filter="contrast(110%) brightness(105%) saturate(120%)" role="listitem" tabindex="0">🌞 Bright</div>
          <div class="filter-item" data-filter="hue-rotate(-20deg) saturate(120%) brightness(105%)" role="listitem" tabindex="0">🌸 Soft Pink</div>
        </div>

        <button id="nextFilter" class="nav-btn" aria-label="Next filter">▶</button>
      </div>

      <div id="controls">
        <label style="display:flex;align-items:center;gap:8px;font-weight:700">
          <input id="timerToggle" type="checkbox" checked style="transform:scale(1.1);accent-color:var(--pink)"/>
          ⏱️ Timer
        </label>

        <button id="capture" aria-label="Ambil foto">Click</button>
        <button id="toFrame" disabled aria-label="Go to frame">Go to Frame</button>
      </div>

      <div id="preview" aria-live="polite" aria-label="Preview foto"></div>
    </div>
  </div>

  <audio id="shutterSound" src="https://www.soundjay.com/mechanical/camera-shutter-click-01.mp3" preload="auto"></audio>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('camera');
      const canvas = document.createElement('canvas');
      const captureBtn = document.getElementById('capture');
      const toFrameBtn = document.getElementById('toFrame');
      const preview = document.getElementById('preview');
      const countdown = document.getElementById('countdown');
      const shutterSound = document.getElementById('shutterSound');
      const timerToggle = document.getElementById('timerToggle');
      const handHint = document.getElementById('handHint');
      const badgeMin = document.getElementById('badgeMin');

      // load persisted photos on start (if any)
      let photos = [];
      try {
        const saved = JSON.parse(localStorage.getItem('capturedPhotos') || '[]');
        if (Array.isArray(saved)) photos = saved.slice(); // clone
      } catch (e) {
        console.warn('Error reading capturedPhotos from storage', e);
        photos = [];
      }

      let currentFilter = 'none';
      let useTimer = true;

      // render preview from photos array
      function renderPreview() {
        preview.innerHTML = '';
        photos.forEach((dataURL, i) => {
          const img = document.createElement('img');
          img.src = dataURL;
          img.className = 'thumb';
          img.alt = `Captured ${i+1}`;
          img.title = 'Klik untuk hapus';
          img.addEventListener('click', () => {
            // remove from array and storage
            photos.splice(i, 1);
            try { localStorage.setItem('capturedPhotos', JSON.stringify(photos)); } catch (err) { console.warn('save failed', err); }
            renderPreview();
            syncUI();
          });
          preview.appendChild(img);
          requestAnimationFrame(() => img.classList.add('show'));
        });
      }

      // start camera stream
      const constraints = { video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
      async function startCamera(){
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            // set base canvas size so capture has sensible resolution
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
          };
        } catch(err){
          console.error('camera error', err);
          alert('Tidak bisa akses kamera: ' + (err && err.message ? err.message : err));
        }
      }
      startCamera();

      timerToggle.addEventListener('change', (e) => useTimer = e.target.checked);

      // helper to compute visible crop when object-fit: cover is used
      function computeVisibleSourceRect(){
        const vw = video.videoWidth, vh = video.videoHeight;
        const cw = video.clientWidth, ch = video.clientHeight;
        if(!vw||!vh) return {sx:0,sy:0,sw:0,sh:0};
        const videoRatio = vw / vh;
        const elemRatio = cw / ch;
        let sx=0, sy=0, sw=vw, sh=vh;
        if(videoRatio > elemRatio){
          const displayedVideoWidth = Math.round(vh * elemRatio);
          sw = displayedVideoWidth;
          sx = Math.round((vw - sw)/2);
        } else {
          const displayedVideoHeight = Math.round(vw / elemRatio);
          sh = displayedVideoHeight;
          sy = Math.round((vh - sh)/2);
        }
        return {sx,sy,sw,sh};
      }

      // persist photos safely (JPEGs recommended to avoid quota quickly)
      function persistPhotos() {
        try {
          localStorage.setItem('capturedPhotos', JSON.stringify(photos));
          console.log('saved', photos.length, 'photos to localStorage');
        } catch (err) {
          console.warn('LocalStorage error, trying to trim and save:', err);
          // fallback: keep last 4 images to reduce size
          photos = photos.slice(-4);
          try { localStorage.setItem('capturedPhotos', JSON.stringify(photos)); }
          catch (e) { console.error('Still failing to save to localStorage', e); alert('Gagal menyimpan foto. Coba kurangi resolusi/kompresi.'); }
        }
      }

      // take photo (capture canvas, mirror, apply filter) and save as JPEG to reduce size
      function takePhoto(){
        const ctx = canvas.getContext('2d');
        const {sx,sy,sw,sh} = computeVisibleSourceRect();
        if (!sw || !sh) {
          console.warn('Video size not ready yet');
          return;
        }
        canvas.width = sw;
        canvas.height = sh;
        ctx.setTransform(-1,0,0,1,sw,0); // mirror horizontally
        ctx.filter = currentFilter || 'none';
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
        // save as JPEG to localStorage (smaller)
        const quality = 0.85;
        const dataURL = canvas.toDataURL('image/jpeg', quality);
        photos.push(dataURL);
        persistPhotos();

        shutterSound.currentTime = 0;
        shutterSound.play();

        renderPreview();
        syncUI();
      }

      // countdown helper
      function startCountdownThenCapture(sec=3){
        let counter = sec;
        countdown.textContent = counter;
        countdown.classList.add('show');
        video.style.transform = 'scaleX(-1) scale(1.02)';
        const iv = setInterval(() => {
          counter--;
          if(counter>0){
            countdown.textContent = counter;
          } else {
            clearInterval(iv);
            countdown.classList.remove('show');
            video.style.transform = 'scaleX(-1) scale(1)';
            takePhoto();
          }
        }, 1000);
      }

      // capture button behavior
      captureBtn.addEventListener('click', () => {
        if(photos.length >= 4){
          alert('Sudah mencapai 4 foto (batas). Klik Go to Frame untuk melanjutkan atau hapus foto jika ingin ulang.');
          return;
        }
        if(useTimer) startCountdownThenCapture(3);
        else takePhoto();
      });

      // Go to Frame: make sure storage has photos and navigate
      toFrameBtn.addEventListener('click', () => {
        if(photos.length < 4){
          alert('Perlu minimal 4 foto untuk lanjut ke Frame.');
          return;
        }
        persistPhotos();
        toFrameBtn.textContent = 'Menyimpan...';
        // small delay to allow storage flush in some browsers
        setTimeout(() => {
          window.location.href = 'Frame.html';
        }, 250);
      });

      // UI sync
      function syncUI(){
        if(photos.length >= 4){
          badgeMin.style.opacity = '0';
          toFrameBtn.disabled = false;
          captureBtn.disabled = true;
        } else {
          badgeMin.style.opacity = '1';
          toFrameBtn.disabled = true;
          captureBtn.disabled = false;
        }
      }

      /* FILTER CAROUSEL */
      const carousel = document.getElementById('filterCarousel');
      const items = carousel.querySelectorAll('.filter-item');
      let currentIndex = 0;
      function applyFilter(i){
        items.forEach(it => it.classList.remove('active'));
        items[i].classList.add('active');
        currentFilter = items[i].dataset.filter || 'none';
        video.style.filter = currentFilter;
      }
      items.forEach((it, i) => {
        it.addEventListener('click', () => { currentIndex = i; applyFilter(i); it.scrollIntoView({behavior:'smooth',inline:'center'}); });
        it.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') { e.preventDefault(); it.click(); } });
      });
      document.getElementById('prevFilter').addEventListener('click', ()=> { if(currentIndex>0) currentIndex--; applyFilter(currentIndex); items[currentIndex].scrollIntoView({behavior:'smooth',inline:'center'}); });
      document.getElementById('nextFilter').addEventListener('click', ()=> { if(currentIndex<items.length-1) currentIndex++; applyFilter(currentIndex); items[currentIndex].scrollIntoView({behavior:'smooth',inline:'center'}); });

      // swipe support
      let startX = 0;
      carousel.addEventListener('touchstart', e => startX = e.touches[0].clientX);
      carousel.addEventListener('touchend', e => {
        const endX = e.changedTouches[0].clientX;
        const diff = startX - endX;
        if(Math.abs(diff)>40){
          if(diff>0 && currentIndex < items.length-1) currentIndex++;
          else if(diff<0 && currentIndex>0) currentIndex--;
          applyFilter(currentIndex);
          items[currentIndex].scrollIntoView({behavior:'smooth',inline:'center'});
        }
      });

      /* MEDIA PIPE HANDS */
      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
      hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.6 });

      let gestureCooldown = false;
      hands.onResults((results) => {
        const has = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
        if(!has){
          handHint.classList.remove('detected');
          return;
        }
        const lm = results.multiHandLandmarks[0];
        const wrist = lm[0], middleTip = lm[12];
        const palmY = wrist.y - middleTip.y;
        if(palmY > 0.28 && !gestureCooldown && photos.length < 4){
          handHint.classList.add('detected');
          gestureCooldown = true;
          startCountdownThenCapture(3);
          setTimeout(()=> gestureCooldown = false, 3500);
        } else if(palmY <= 0.28){
          handHint.classList.remove('detected');
        }
      });

      const cameraAI = new Camera(video, { onFrame: async () => { await hands.send({ image: video }); }, width:640, height:480 });

      // start mediapipe camera after video has data
      video.addEventListener('loadeddata', () => {
        try { cameraAI.start(); } catch (e) { /* ignore */ }
      });

      // initial render and UI
      renderPreview();
      syncUI();

      // small hint animation
      setTimeout(()=> {
        badgeMin.animate([{ transform:'translateY(0)' }, { transform:'translateY(-6px)' }, { transform:'translateY(0)' }], { duration:900, easing:'ease-out' });
      }, 600);
    });
  </script>
</body>
</html>
